name: android-apk

# Build the engine + SDL3 (core/image/ttf/mixer) and package an installable APK,
# from SDL3's official android-project template with our sources injected.
# arm64-v8a only (most tablets). The APK is uploaded as an artifact to sideload.

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# the release-upload step needs write access to the repo's releases; without
# this the default GITHUB_TOKEN is read-only and `gh release upload` 403s
permissions:
  contents: write

jobs:
  apk:
    name: Build debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: repo

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK
        run: |
          set -eux
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "ndk;29.0.14206865"

      - name: Clone SDL3 + satellites (pinned releases, with vendored deps)
        run: |
          set -eux
          # pinned tags (not the GitHub API) so the build is reproducible and
          # doesn't hit the unauthenticated API rate limit on frequent runs
          clone() {  # $1 = repo, $2 = tag
            echo "$1 -> $2"
            git clone --depth 1 --branch "$2" --recurse-submodules --shallow-submodules \
              "https://github.com/libsdl-org/$1" "$1"
          }
          clone SDL        release-3.4.12
          clone SDL_image  release-3.4.4
          clone SDL_ttf    release-3.2.2
          clone SDL_mixer  release-3.2.4

      - name: Assemble Android project
        run: |
          set -eux
          # base = SDL's android-project template
          cp -r SDL/android-project proj

          # SDL libraries as CMake subprojects under app/jni/
          rm -rf proj/app/jni/SDL
          cp -r SDL          proj/app/jni/SDL
          cp -r SDL_image    proj/app/jni/SDL_image
          cp -r SDL_ttf      proj/app/jni/SDL_ttf
          cp -r SDL_mixer    proj/app/jni/SDL_mixer

          # our JNI build (replaces the template's hello-world jni)
          cp repo/android/jni/CMakeLists.txt        proj/app/jni/CMakeLists.txt
          rm -rf proj/app/jni/src
          cp -r repo/android/jni/zodapp             proj/app/jni/zodapp
          cp -r repo/src                            proj/app/jni/zodapp/zod

          # stamp the real build version (git describe) into the APK, replacing the
          # "android-spike" placeholder, so the engine reports the same ZOD_VERSION /
          # "server version is X" as desktop instead of a dev placeholder.
          VER=$(cd repo && git describe --tags --always --dirty 2>/dev/null || echo "0.0.0")
          sed -i "s/android-spike/${VER}/" proj/app/jni/zodapp/CMakeLists.txt
          echo "stamped Android ZOD_VERSION = ${VER}"

          # our activity (keep SDL's org.libsdl.app.* java in place) + manifest
          mkdir -p proj/app/src/main/java/io/github/fenio/zod
          cp repo/android/ZodActivity.java          proj/app/src/main/java/io/github/fenio/zod/ZodActivity.java
          cp repo/android/AndroidManifest.xml       proj/app/src/main/AndroidManifest.xml

          # #86: our launcher icon (red bot face) over the template's default SDL
          # icon - adaptive (mipmap-anydpi-v26) plus legacy PNG densities. The
          # manifest references @mipmap/ic_launcher. Trailing /. copies contents.
          cp -r repo/android/res/.                  proj/app/src/main/res/

          # game data bundled into the APK; extracted to writable storage on
          # first launch (see AndroidExtractAssetsAndChdir), driven by filelist.txt
          mkdir -p proj/app/src/main/assets/zod
          cp -r repo/assets       proj/app/src/main/assets/zod/assets
          cp -r repo/maps         proj/app/src/main/assets/zod/maps
          cp repo/map_list.txt    proj/app/src/main/assets/zod/map_list.txt
          ( cd proj/app/src/main/assets/zod && find assets maps map_list.txt -type f | sort > filelist.txt )
          echo "bundled data files: $(wc -l < proj/app/src/main/assets/zod/filelist.txt)"

          # point the app id / namespace at ours and limit to arm64-v8a.
          # the template uses the newer `namespace = "..."` DSL (with the '='),
          # so the regex must allow an optional '='.
          GR=proj/app/build.gradle

          # Keep the generated SDL project on an explicit, compatible Android
          # toolchain instead of silently inheriting old template defaults.
          sed -i "s/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:9.3.0/" proj/build.gradle
          sed -i 's/gradle-[0-9.]*-bin.zip/gradle-9.5.0-bin.zip/' proj/gradle/wrapper/gradle-wrapper.properties
          sed -i '/distributionSha256Sum=/d' proj/gradle/wrapper/gradle-wrapper.properties
          sed -i '/distributionUrl=/a distributionSha256Sum=553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746' \
            proj/gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's/compileSdkVersion [0-9]+/compileSdkVersion 37/' "$GR"
          sed -i -E 's/targetSdkVersion [0-9]+/targetSdkVersion 37/' "$GR"
          sed -i -E 's/ndkVersion = "[^"]+"/ndkVersion = "29.0.14206865"/' "$GR"
          sed -i 's/proguard-android.txt/proguard-android-optimize.txt/' "$GR"
          sed -i '/    applicationVariants.all { variant ->/,/    }/d' "$GR"
          # The dollar expressions below belong to generated Groovy, not Bash.
          # shellcheck disable=SC2016
          printf '%s\n' \
            '' \
            'androidComponents {' \
            '    onVariants(selector().all()) { variant ->' \
            '        def variantName = variant.name.capitalize()' \
            '        tasks.configureEach {' \
            '            if (name == "merge${variantName}Assets") {' \
            '                dependsOn("externalNativeBuild${variantName}")' \
            '            }' \
            '        }' \
            '    }' \
            '}' >> "$GR"

          sed -i -E 's/(applicationId[[:space:]]*=?[[:space:]]*)"[^"]*"/\1"io.github.fenio.zod"/' "$GR"
          sed -i -E 's/(namespace[[:space:]]*=?[[:space:]]*)"[^"]*"/\1"io.github.fenio.zod"/'         "$GR"
          # the engine calls if_nameindex()/if_freenameindex() (net iface list),
          # added to Bionic in API 24; the template targets API 21. Raise to 24
          # (Android 7.0) so they're declared.
          sed -i -E 's/android-[0-9]+/android-24/g' "$GR"
          sed -i -E 's/(minSdkVersion[[:space:]]*=?[[:space:]]*)[0-9]+/\124/g' "$GR"
          sed -i -E 's/(minSdk[[:space:]]*=?[[:space:]]*)[0-9]+/\124/g'        "$GR"
          # add an abiFilters line inside defaultConfig if not present
          grep -q abiFilters "$GR" || \
            sed -i '/defaultConfig {/a\        ndk { abiFilters "arm64-v8a" }' "$GR"
          echo "----- app/build.gradle -----"; cat "$GR"

      - name: Build APK
        run: |
          set -eux
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          cd proj
          chmod +x gradlew
          # -PBUILD_WITH_CMAKE selects our jni/CMakeLists.txt (which builds
          # libmain.so from the engine); without it the template defaults to
          # ndkBuild and our CMake is ignored.
          ./gradlew --no-daemon assembleDebug -PBUILD_WITH_CMAKE --stacktrace

      - name: Locate APK
        if: always()
        run: |
          find proj -name '*.apk' -print || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zod-android-arm64-debug
          path: proj/app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore

      # On a published release, also attach the APK to the release (experimental,
      # debug-signed arm64-v8a build).
      - name: Attach APK to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          tag="${{ github.event.release.tag_name }}"
          apk="$(find proj -name '*.apk' | head -1)"
          out="zod-android-arm64-${tag}-debug.apk"
          cp "$apk" "$out"
          gh release upload "$tag" "$out" --repo "$GITHUB_REPOSITORY" --clobber
