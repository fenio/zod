name: build

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        # bounded parallelism: unlimited -j OOM-kills the runner (several huge
        # source files compiled at -O2 simultaneously)
        run: cmake --build build --parallel 4

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake pkg-config sdl2 sdl2_image sdl2_mixer sdl2_ttf
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        # bounded parallelism: unlimited -j OOM-kills the runner (several huge
        # source files compiled at -O2 simultaneously)
        run: cmake --build build --parallel 4
