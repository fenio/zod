name: build

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libsdl3-dev libsdl3-image-dev libsdl3-mixer-dev libsdl3-ttf-dev
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        # bounded parallelism: unlimited -j OOM-kills the runner (several huge
        # source files compiled at -O2 simultaneously)
        run: cmake --build build --parallel 4

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake pkg-config sdl3 sdl3_image sdl3_mixer sdl3_ttf
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        # bounded parallelism: unlimited -j OOM-kills the runner (several huge
        # source files compiled at -O2 simultaneously)
        run: cmake --build build --parallel 4

  windows:
    name: Windows (MSYS2 MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-sdl3-image
            mingw-w64-x86_64-sdl3-mixer
            mingw-w64-x86_64-sdl3-ttf
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build --parallel 4
