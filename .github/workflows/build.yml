name: build

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (Ubuntu 26.04)
    runs-on: ubuntu-latest
    # The GitHub ubuntu-latest runner is still 24.04, whose apt has no SDL3 at
    # all. SDL3 + the new MIX_-API SDL3_mixer (3.2.4) first land in Ubuntu 26.04,
    # so build inside a 26.04 container where apt can satisfy every SDL3 dep.
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config curl ca-certificates \
            libsdl3-dev libsdl3-image-dev libsdl3-ttf-dev
      - name: Build SDL3_mixer from source
        # 26.04's libsdl3-mixer-dev (3.2.4, the new MIX_ API) was uploaded only
        # days ago and hasn't migrated to the release pocket yet, so build it
        # from the upstream release against the apt-provided SDL3. Decoders are
        # disabled — the engine only needs the MIX_ symbols to link in CI.
        run: |
          curl -fsSL -o /tmp/mixer.tar.gz \
            https://github.com/libsdl-org/SDL_mixer/releases/download/release-3.2.4/SDL3_mixer-3.2.4.tar.gz
          mkdir -p /tmp/mixer && tar -xzf /tmp/mixer.tar.gz -C /tmp/mixer --strip-components=1
          cmake -S /tmp/mixer -B /tmp/mixer/build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_SHARED_LIBS=ON -DSDLMIXER_VENDORED=OFF -DSDLMIXER_SAMPLES=OFF \
            -DSDLMIXER_FLAC=OFF -DSDLMIXER_GME=OFF -DSDLMIXER_MOD=OFF \
            -DSDLMIXER_MP3=OFF -DSDLMIXER_MIDI=OFF -DSDLMIXER_OPUS=OFF \
            -DSDLMIXER_VORBIS=OFF -DSDLMIXER_WAVPACK=OFF
          cmake --build /tmp/mixer/build --parallel 4
          cmake --install /tmp/mixer/build
          ldconfig
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        # bounded parallelism: unlimited -j OOM-kills the runner (several huge
        # source files compiled at -O2 simultaneously)
        run: cmake --build build --parallel 4
      - name: Run functional tests
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: brew install cmake pkg-config sdl3 sdl3_image sdl3_mixer sdl3_ttf
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        # bounded parallelism: unlimited -j OOM-kills the runner (several huge
        # source files compiled at -O2 simultaneously)
        run: cmake --build build --parallel 4
      - name: Run functional tests
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSYS2 MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-sdl3-image
            mingw-w64-x86_64-sdl3-mixer
            mingw-w64-x86_64-sdl3-ttf
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build --parallel 4
