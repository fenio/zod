name: codeql

# GitHub's CodeQL security/bug scanner for the C++ sources. Findings land in
# the repository's Security > Code scanning tab and as PR annotations.
# C/C++ analysis needs a real build, so this mirrors build.yml's Linux setup.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 4 * * 1' # weekly, so new CodeQL queries re-scan the codebase

jobs:
  analyze:
    name: CodeQL (C/C++)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config curl ca-certificates git \
            libsdl3-dev libsdl3-image-dev libsdl3-ttf-dev
      - name: Build SDL3_mixer from source
        run: |
          curl -fsSL -o /tmp/mixer.tar.gz \
            https://github.com/libsdl-org/SDL_mixer/releases/download/release-3.2.4/SDL3_mixer-3.2.4.tar.gz
          mkdir -p /tmp/mixer && tar -xzf /tmp/mixer.tar.gz -C /tmp/mixer --strip-components=1
          cmake -S /tmp/mixer -B /tmp/mixer/build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_SHARED_LIBS=ON -DSDLMIXER_VENDORED=OFF -DSDLMIXER_SAMPLES=OFF \
            -DSDLMIXER_FLAC=OFF -DSDLMIXER_GME=OFF -DSDLMIXER_MOD=OFF \
            -DSDLMIXER_MP3=OFF -DSDLMIXER_MIDI=OFF -DSDLMIXER_OPUS=OFF \
            -DSDLMIXER_VORBIS=OFF -DSDLMIXER_WAVPACK=OFF
          cmake --build /tmp/mixer/build --parallel 4
          cmake --install /tmp/mixer/build
          ldconfig
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build --parallel 4
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:c-cpp'
