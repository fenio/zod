name: android-compile-probe

# Feasibility spike, milestone 1a: does the engine's C++ even cross-compile for
# Android (NDK Clang / Bionic / arm64)? This compiles every engine source to an
# object file against the SDL3 headers - no linking, no Gradle, no APK - so it
# answers the single riskiest question fast (~minutes). Linking + packaging into
# a real APK is a later milestone.

on:
  push:
    branches: [android-spike]
  workflow_dispatch:

jobs:
  compile-probe:
    name: Cross-compile for Android arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SDL3 headers (core + image + ttf + mixer)
        run: |
          set -eux
          for r in SDL SDL_image SDL_ttf SDL_mixer; do
            git clone --depth 1 https://github.com/libsdl-org/$r ext/$r
          done

      - name: Compile every engine source for aarch64-linux-android
        run: |
          set -u
          TC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CXX="$TC/aarch64-linux-android24-clang++"
          echo "using: $CXX"; "$CXX" --version | head -1

          INC="-Iext/SDL/include -Iext/SDL_image/include -Iext/SDL_ttf/include -Iext/SDL_mixer/include -Isrc"
          DEF="-DDISABLE_OPENGL -DDISABLE_REGCHECK -DDISABLE_MYSQL -DZOD_VERSION=\"android-spike\" -DZOD_DATADIR=\"\""
          WARN="-Wno-deprecated -Wno-write-strings"

          # the same files the desktop build excludes (editors / utilities / win-only)
          EXCLUDE="map_editor map_merger map_gen_main zod_tests tile_info_editor win_tray zgfile"

          mkdir -p obj
          fails=0; total=0
          for f in src/*.cpp; do
            b="$(basename "$f" .cpp)"
            skip=0; for e in $EXCLUDE; do [ "$b" = "$e" ] && skip=1; done
            [ "$skip" = 1 ] && continue
            total=$((total+1))
            if ! "$CXX" -std=c++14 -fPIC -c "$f" -o "obj/$b.o" $INC $DEF $WARN 2> "obj/$b.err"; then
              echo "::group::FAIL $f"; cat "obj/$b.err"; echo "::endgroup::"
              fails=$((fails+1))
            fi
          done
          echo "----------------------------------------"
          echo "compiled OK: $((total-fails)) / $total   failed: $fails"
          # surface the most common error lines across all failures
          if [ "$fails" -gt 0 ]; then
            echo "=== top error patterns ==="
            cat obj/*.err | grep -E 'error:' | sed -E 's/^[^ ]+:[0-9]+:[0-9]+: //' | sort | uniq -c | sort -rn | head -30
          fi
          exit $fails
